data:
  raw_dir: ./Data/raw
  sample_dir: ./Data/user_posts       # for dev work before full download
  conflict_window: ["2023-10-01", "2024-03-18"]
  conflict_window_parquet: ./Data/conflict_window_posts.parquet  # pre-extracted from tar
  cascade_min_size: 10                # adjusted empirically; fallback to 5
  cascade_max_size: 10000

nlp_filter:
  keyword_tiers: [1, 2, 3, 4, 5]     # all tiers active by default
  use_sample_dir: true                # set false to stream from raw_dir/user_posts.tar.gz
  sample_files: 3                     # for validate_filter stage
  validation_sample_n: 200
  batch_write_every: 10               # write parquet every N files processed

cascade:
  parent_priority: [follower, temporal, root]
  edge_types: {FOLLOWER: 0, NON_FOLLOWER: 1, UNKNOWN: 2}
  follower_db_path: ./Data/followers.duckdb   # pre-built DuckDB from followers.csv.gz

model:
  encoder: rgcn                       # options: rgcn | gcn (ablation A1)
  rgcn_bases: 2
  rgcn_layers: 2                      # v6: was 3 — 3-hop over-smooths small cascades (min_size=10); 2 layers + residuals preferred
  rgcn_dropout: 0.3
  input_dim: 6                        # temporal + sent_label + sent_score + depth + in_deg + out_deg
  hidden_dim: 128
  embedding_dim: 64
  pool: mean                          # v5: diffpool disabled — pool_2 collapsed in all 4 runs (structural: k2=250 supernodes >> actual cascade sizes)
  use_root_readout: false             # v7: disabled — root has 3 constant features (temporal=0, depth=0, in_deg=0) → eff_dim=1.1 in v6, diluting readout MLP
  pool_ratios: [0.5, 0.25]
  diffpool_aux_weight: 0.1            # sweet spot: enough encoder regularisation without dominating InfoNCE (v2=0.5 killed pool_2, v3=0.01 starved encoder)
  projector_hidden_dim: 256           # wider projector — more capacity to absorb collapse (was 128)
  projector_layers: 3                 # deeper projector — VICReg/SimCLR v2 best practice (was 2)
  projector_bn: true                  # BatchNorm in projector — stabilises training, prevents projector-level collapse
  diffpool_max_nodes: 1000            # cap for DiffPool memory; larger cascades use SAGPool
  use_sentiment: true                 # set false for ablation A4

augmentation:
  strategy: feed_aware                # options: feed_aware | random (ablation A2)
  follower_retain_ratio: 0.3          # v6: was 0.5 — views too similar; need genuinely destructive perturbation
  temporal_prefix_ratio: 0.3          # v7: was 0.2 — 12.8% fallback rate in v6; 0.3 reduces fallbacks while still creating distinct views
  bridge_remove_ratio: 0.7            # v6: was 0.5 — aggressively remove non-follower entry nodes
  feature_mask_ratio: 0.4             # v6: was 0.25 — mask 40% of node features to prevent trivial feature matching
  min_nodes_after_aug: 5              # v7: raised from 1 — single-node cascades produce zero-norm embeddings → NaN alignment + norm instability
  hard_negatives: true

training:
  epochs: 50                        # v7: was 75 — best epoch was 74/75 in v6, model still improving at cutoff; early_stopping_patience=15 will stop early if it plateaus
  batch_size: 64
  lr: 1.0e-3
  lr_schedule: cosine                 # options: cosine | constant
  lr_min: 1.0e-5
  warmup_epochs: 5
  temperature: 0.1                    # v6: lowered from 0.3 — harder contrastive task forces the model to distinguish cascades; alignment=0.999 means task is too easy
  grad_clip_norm: 5.0                # v7: was 2.0 — clipped 100% of epochs in v6 (mean norm=3.744); 5.0 allows model to actually learn
  checkpoint_every: 10               # epochs between checkpoints
  log_grad_norm_every: 50            # batches between gradient norm logs
  variance_weight: 0.1               # reduced from 0.25 — covariance handles decorrelation now
  covariance_weight: 0.25             # v7: was 1.0 — 86.9% covariance reduction achieved in v6; weight=1.0 caused grad norm=3.744 (clipped every epoch); 0.25 maintains pressure without dominating
  early_stopping_patience: 15        # epochs without improvement before stopping
  early_stopping_min_delta: 0.0001   # minimum loss decrease to count as improvement

clustering:
  min_cluster_size_grid: [50, 100, 200]
  min_samples: null                   # null = same as min_cluster_size
  umap_n_components: 2
  umap_n_neighbors: 15
  umap_min_dist: 0.1

evaluation:
  bootstrap_n: 1000
  stability_subsamples: 10
  stability_ratio: 0.8

explain:
  n_representatives_per_cluster: 20  # cascades sampled for augmentation sensitivity + viz
  run_probes: true
  run_diffpool_analysis: true
  run_augmentation_sensitivity: true
  run_cluster_profiles: true
  run_representative_viz: true        # cascade tree plots per archetype (requires networkx)
  probe_properties:
    - cascade_depth
    - cascade_breadth
    - wiener_index
    - follower_edge_ratio
    - cascade_size
    - event_window
  figures_dpi: 300
  probe_bootstrap_n: 200              # bootstrap iterations for probe CIs (probes are cheap)
